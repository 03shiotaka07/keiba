<style>
:root{

  --plus:#1f7a4d; --minus:#c2402d; --g1:#b3261e; --g2:#b7791f; --g3:#2f6690; --gj:#6b4c9a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body.lock{overflow:hidden}
#app{max-width:520px;margin:0 auto;padding:calc(var(--sat) + 10px) 14px calc(86px + var(--sab));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--serif)}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 2px 10px;border-bottom:2px double var(--ink);margin-bottom:14px}
.top h1{font-size:22px;letter-spacing:.08em}
.top .sub{font-size:12px;color:var(--sub)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(29,37,64,.04)}
.card h3{font-size:15px;margin-bottom:8px;letter-spacing:.05em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.widget{border-radius:20px;padding:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;min-height:150px}
.widget .wl{font-size:11px;color:var(--sub);letter-spacing:.08em}
.widget.next{background:linear-gradient(160deg,#fffdf7 55%,#f1e7cc)}
.widget .big{font-family:var(--serif);font-size:19px;line-height:1.25;margin:6px 0 4px;font-weight:700}
.widget .when{font-size:12px;color:var(--sub)}
.widget .cd{position:absolute;right:12px;bottom:10px;font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.widget .cd small{font-size:12px;margin-left:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;vertical-align:middle;background:var(--sub)}
.badge.G1{background:var(--g1)} .badge.G2{background:var(--g2)} .badge.G3{background:var(--g3)}
.badge.J{background:var(--gj)} .badge.N{background:#4b5563}
.pl{font-variant-numeric:tabular-nums;font-weight:700}
.pl.p{color:var(--plus)} .pl.m{color:var(--minus)} .pl.z{color:var(--sub)}
.kpi{font-family:var(--serif);font-size:28px;font-weight:700;margin-top:4px;line-height:1.15}
.kv{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--sub)}
.kv b{color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.mini .h{color:var(--sub);font-size:10px;padding-bottom:2px}
.mini .d{height:34px;border-radius:8px;padding-top:3px;position:relative}
.mini .d.today{outline:1.5px solid var(--ink)}
.mini .d.has{background:#f3ebd6}
.dots{display:flex;justify-content:center;gap:2px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--g3)}
.dot.G1{background:var(--g1)} .dot.G2{background:var(--g2)} .dot.G3{background:var(--g3)} .dot.J{background:var(--gj)}
.sun{color:var(--minus)} .sat{color:#2d5fa8}
.rlist{margin-top:10px;border-top:1px dashed var(--line)}
.rrow{display:flex;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rrow .dt{width:62px;font-size:12px;color:var(--sub);flex:none}
.rrow .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .tr{font-size:11px;color:var(--sub);flex:none}
.rrow.past{opacity:.5}
.seg{display:flex;background:#ece3cc;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:8px;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-family:var(--serif);font-size:18px}
.nav button{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:34px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.cal .c{min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px 3px 2px;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative}
.cal .c.out{visibility:hidden}
.cal .c.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cal .c.today .n{background:var(--ink);color:#fff;border-radius:50%;width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center}
.cal .n{font-size:11px;font-weight:700;height:19px}
.cal .v{font-size:10px;font-weight:700;letter-spacing:-.02em;margin-top:auto;text-align:right;font-variant-numeric:tabular-nums}
.cal .dots{justify-content:flex-start;margin:0}
.rec{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.rec .t1{display:flex;gap:6px;align-items:center}
.rec .t1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);font-size:16px}
.rec .t2{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:3px}
.dayh{font-family:var(--serif);font-size:13px;color:var(--sub);margin:14px 2px 6px;border-bottom:1px solid var(--line);padding-bottom:2px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,239,225,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:20}
.tabbar .in{display:flex;width:100%;max-width:520px}
.tabbar button{flex:1;background:none;border:0;padding:7px 0 6px;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(72px + var(--sab));width:54px;height:54px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:28px;box-shadow:0 6px 16px rgba(29,37,64,.3);z-index:19}
.layer{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;flex-direction:column}
.layer.show{display:flex}
#layer2{z-index:60}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 12px 8px;border-bottom:2px double var(--ink);background:var(--paper)}
.sheet-head b{font-family:var(--serif);font-size:17px}
.sheet-head button{background:none;border:0;padding:8px 6px;font-size:15px}
.sheet-head .primary{background:var(--ink);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:12px 14px calc(30px + var(--sab));max-width:520px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
label.f{display:block;font-size:12px;color:var(--sub);margin-bottom:9px}
label.f>input,label.f>select,label.f>textarea,.inp{display:block;width:100%;margin-top:3px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;color:var(--ink);font-size:15px}
textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:1px solid var(--ink);background:none;border-radius:11px;padding:10px;font-weight:600;margin-bottom:8px;color:var(--ink)}
.btn.fill{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--minus);color:var(--minus)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:13px;margin:0 6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:14px;min-width:42px;text-align:center}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.chip.dis{opacity:.3;pointer-events:none}
.chip.nm{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:4px 6px;min-width:46px}
.chip.nm i{font-style:normal;font-size:9px;opacity:.75;white-space:nowrap}
.sl{font-size:12px;color:var(--sub);margin-top:6px}
.tk{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:7px;background:#fff;width:100%;text-align:left}
.tk .l{flex:1;min-width:0}
.tk .l b{display:block;font-size:14px;overflow-wrap:anywhere}
.tk .l span{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;border:1px solid var(--line);color:var(--sub)}
.tag.hit{background:var(--plus);border-color:var(--plus);color:#fff}
.tag.miss{background:#9a9aa5;border-color:#9a9aa5;color:#fff}
.tag.refund{background:var(--gold);border-color:var(--gold);color:#fff}
.x{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 8px}
.sum{display:flex;justify-content:space-between;font-size:13px;padding-top:6px;color:var(--sub)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{width:76px;height:76px;border-radius:10px;border:1px solid var(--line);background:#eee center/cover;position:relative}
.photos .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px}
.stat6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stat6 div{background:#f7f1de;border-radius:10px;padding:8px;text-align:center}
.stat6 span{display:block;font-size:10px;color:var(--sub)}
.stat6 b{font-size:14px;font-variant-numeric:tabular-nums}
.bars .br{display:grid;grid-template-columns:62px 1fr 56px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.bars .tr{height:14px;background:#efe6cf;border-radius:7px;position:relative;overflow:visible}
.bars .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--plus)}
.bars .tr i.lo{background:var(--minus)}
.bars .tr u{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1.5px dashed var(--ink);opacity:.55}
.bars .sm{grid-column:2/4;font-size:11px;color:var(--sub);margin-top:-4px}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.vid{position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prog{height:8px;background:#e8dfc7;border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.pick-r{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:6px}
.pick-r .dt{width:64px;font-size:12px;color:var(--sub);flex:none}
.pick-r .nm{flex:1;font-weight:600;min-width:0}
.pick-r .sb{font-size:11px;color:var(--sub);display:block;font-weight:400}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

/* ================= 組合せ・馬券計算 ================= */
function combos(arr,k){const out=[];(function rec(s,cur){if(cur.length===k){out.push(cur.slice());return;}for(let i=s;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop();}})(0,[]);return out;}
function perms(arr,k){const out=[],used=new Array(arr.length).fill(false);(function rec(cur){if(cur.length===k){out.push(cur.slice());return;}for(let i=0;i<arr.length;i++){if(used[i])continue;used[i]=true;cur.push(arr[i]);rec(cur);cur.pop();used[i]=false;}})([]);return out;}
const uniq=a=>[...new Set(a)].sort((x,y)=>x-y);

function enumTicket(tk){
  const m=TT[tk.type]; if(!m) return {n:0,list:[]};
  const k=m.k, ord=m.ordered;
  if(tk.method==='手入力') return {n:Math.max(0,parseInt(tk.manualPoints,10)||0),list:null};
  let list=[];
  if(tk.method==='通常'){
    const t=(tk.cols||[]).slice(0,k).map(c=>(c||[])[0]);
    if(t.length<k||t.some(v=>v==null)) return {n:0,list:[]};
    if(!m.frame&&new Set(t).size<k) return {n:0,list:[]};
    list=[ord?t:t.slice().sort((a,b)=>a-b)];
  }else if(tk.method==='ボックス'){
    const Sx=uniq(tk.box||[]); list=ord?perms(Sx,k):combos(Sx,k);
  }else if(tk.method==='フォーメーション'){
    const cols=[];for(let i=0;i<k;i++)cols.push((tk.cols||[])[i]||[]);
    const U=uniq([].concat(...cols));
    const cand=ord?perms(U,k):combos(U,k);
    const pp=perms([...Array(k).keys()],k);
    list=cand.filter(t=>ord?t.every((v,i)=>cols[i].includes(v)):pp.some(p=>p.every((pi,i)=>cols[i].includes(t[pi]))));
  }else if(tk.method==='ながし'){
    const ax=uniq(tk.axis||[]); const pt=uniq((tk.partners||[]).filter(v=>!ax.includes(v)));
    const a=ax.length; if(a<1||a>=k) return {n:0,list:[]};
    const U=uniq(ax.concat(pt));
    const cand=ord?perms(U,k):combos(U,k);
    list=cand.filter(t=>ax.every(v=>t.includes(v))&&t.every(v=>ax.includes(v)||pt.includes(v)));
    if(ord){
      const pos=String(tk.axisPos||'multi');
      if(a===1&&/^[1-3]$/.test(pos)) list=list.filter(t=>t[+pos-1]===ax[0]);
      else if(a===2&&/^[1-3]{2}$/.test(pos)){const ps=pos.split('').map(x=>+x-1);list=list.filter(t=>ps.every(i=>ax.includes(t[i])));}
    }
  }
  return {n:list.length,list};
}
function posLabel(tk,m){
  if(!m.ordered) return '';
  const p=String(tk.axisPos||'multi');
  if(p==='multi') return '(マルチ)';
  if(/^\d$/.test(p)) return `(${p}着)`;
  return `(${p[0]}-${p[1]}着)`;
}
function ticketLabel(tk){
  const m=TT[tk.type]; if(!m) return '';
  const sep=m.ordered?'→':'-'; let body='';
  if(tk.method==='手入力') body=tk.manualLabel||'';
  else if(tk.method==='通常') body=(tk.cols||[]).slice(0,m.k).map(c=>(c||[])[0]!=null?c[0]:'?').join(sep);
  else if(tk.method==='ボックス') body='BOX '+uniq(tk.box||[]).join(',');
  else if(tk.method==='フォーメーション'){const a=[];for(let i=0;i<m.k;i++)a.push(uniq((tk.cols||[])[i]||[]).join(','));body='F '+a.join(sep);}
  else body='軸'+uniq(tk.axis||[]).join(',')+posLabel(tk,m)+'→'+uniq(tk.partners||[]).join(',');
  return `${tk.type} ${body}`.trim();
}
function finalizeTicket(tk){
  const {n}=enumTicket(tk);
  tk.unit=Math.max(100,Math.round((+tk.unit||100)/100)*100);
  tk.points=n; tk.cost=n*tk.unit; tk.label=ticketLabel(tk);
  if(tk.result==='miss') tk.payout=0;
  tk.payout=Math.max(0,Math.round(+tk.payout||0));
  return tk;
}

/* ================= 集計 ================= */
const settled=t=>t.result==='hit'||t.result==='miss'||t.result==='refund';
function aggregate(recs){
  let cost=0,pay=0,hitT=0,missT=0,pending=0;const byType={};
  for(const r of recs)for(const t of (r.tickets||[])){
    if(!settled(t)){pending++;continue;}
    const c=t.cost||0,p=t.payout||0;cost+=c;pay+=p;
    if(t.result==='hit')hitT++;else if(t.result==='miss')missT++;
    const b=byType[t.type]||(byType[t.type]={cost:0,pay:0,hit:0,n:0});
    b.cost+=c;b.pay+=p;b.n++;if(t.result==='hit')b.hit++;
  }
  return {cost,pay,profit:pay-cost,roi:cost?pay/cost*100:null,hitRate:(hitT+missT)?hitT/(hitT+missT)*100:null,pending,hitT,missT,byType,races:recs.length};
}
function groupAgg(recs,keyFn){
  const g={};for(const r of recs){const k=keyFn(r);(g[k]||(g[k]=[])).push(r);}
  return Object.keys(g).map(k=>({key:k,...aggregate(g[k])}));
}

function findRaceInText(text){
  const t=normName(text);let best=null;
  for(const r of allRaces()){const n=normName(r.name);if(n.length>=3&&t.includes(n)&&(!best||n.length>normName(best.name).length))best=r;}
  return best;
}
function parseMeta(raw){
  const t=normT(raw);const m={};
  const race=findRaceInText(t);
  if(race)Object.assign(m,{date:race.date,track:race.track,name:race.name,grade:race.grade,dist:race.dist});
  let x=t.match(/(20\d{2})[\/年.\-](\d{1,2})[\/月.\-](\d{1,2})/);
  if(x&&!m.date)m.date=`${x[1]}-${pad(+x[2])}-${pad(+x[3])}`;
  else if(!m.date){x=t.match(/(\d{1,2})月\s*(\d{1,2})日/);if(x)m.date=`${new Date().getFullYear()}-${pad(+x[1])}-${pad(+x[2])}`;}
  if(!m.track){const tr=TRACKS_JRA.find(n=>t.includes(n.replace(/\(.*\)/,'')));if(tr)m.track=tr;}
  x=t.match(/(\d{1,2})\s*R/);if(x&&+x[1]>=1&&+x[1]<=12)m.raceNo=+x[1];
  if(!m.dist){x=t.match(/(芝|ダート|ダ|障害|障)\s*(\d{3,4})\s*m?/);if(x)m.dist=(x[1][0]==='ダ'?'ダ':x[1][0]==='障'?'障':'芝')+x[2]+'m';}
  if(!m.grade){x=t.match(/G(III|II|I)(?![A-Za-z])/);if(x)m.grade={I:'G1',II:'G2',III:'G3'}[x[1]];}
  return m;
}
function parseRaceCard(raw){
  const t=normT(raw).replace(/([ァ-ヶー・])[ \t]+(?=[ァ-ヶー・])/g,'$1');
  const horses=[],seen=new Set();
  for(const line of t.split(/\r?\n/)){
    let m=line.match(/^\s*(\d{1,2})\s+(\d{1,2})\s+([ァ-ヶー・]{2,10})/),no=0,name='';
    if(m){no=+m[2];name=m[3];}
    else{m=line.match(/^\s*(\d{1,2})\s+([ァ-ヶー・]{2,10})/);if(m){no=+m[1];name=m[2];}}
    if(name&&no>=1&&no<=18&&!seen.has(no)){seen.add(no);horses.push({no,name});}
  }
  horses.sort((a,b)=>a.no-b.no);
  return {horses,meta:parseMeta(raw)};
}
function parseTickets(raw){
  let t=normT(raw).replace(/(\d)\s*[ー‐‑‒–—―－−~〜]\s*(?=\d)/g,'$1-').replace(/(\d)\s*[→>]\s*(?=\d)/g,'$1-');
  const meta=parseMeta(raw);
  const re=/(単勝|複勝|枠連|枠単|馬連|馬単|ワイド|3連複|三連複|3連単|三連単)/g;
  const hits=[...t.matchAll(re)];const tickets=[];
  hits.forEach((h,i)=>{
    const end=i+1<hits.length?hits[i+1].index:t.length;
    const block=t.slice(h.index,end);
    const type={'3連複':'三連複','3連単':'三連単'}[h[1]]||h[1];
    const m=TT[type];
    const hasBox=/ボックス|BOX/i.test(block),hasNaga=/流し|ながし|ナガシ/.test(block),hasForm=/フォーメ/.test(block);
    let amount=0;
    for(const a of block.replace(/払戻[^\d]{0,8}[\d,]+\s*円/g,' ').matchAll(/(\d{1,3}(?:,\d{3})+|\d{3,6})\s*円/g)){const v=+a[1].replace(/,/g,'');if(v>=100&&v%100===0&&v>amount)amount=v;}
    const b2=block.replace(/[\d,]+\s*円/g,' ').replace(/\d{1,2}\s*R/g,' ').replace(/20\d{2}[\/年.\-]\d{1,2}[\/月.\-]\d{1,2}/g,' ').replace(/(単勝|複勝|枠連|枠単|馬連|馬単|ワイド|3連複|三連複|3連単|三連単)/,' ');
    const seqs=[...b2.matchAll(/\d{1,2}(?:\s*-\s*\d{1,2})+/g)].map(x=>x[0].split(/\s*-\s*/).map(Number));
    let nums;
    if(seqs.length)nums=seqs[0];
    else nums=[...b2.matchAll(/(?<![\d-])\d{1,2}(?![\d-])/g)].map(x=>+x[0]);
    const lim=m.frame?8:18;
    nums=nums.filter(n=>n>=1&&n<=lim).slice(0,18);
    const d={type,method:'手入力',cols:[[],[],[]],box:[],axis:[],partners:[],axisN:1,axisPos:'multi',unit:100,manualLabel:'',manualPoints:1,result:'pending',payout:0};
    if(hasBox&&nums.length>=m.k&&!m.frame){d.method='ボックス';d.box=uniq(nums);}
    else if(!hasNaga&&!hasForm&&nums.length===m.k){d.method='通常';d.cols=nums.map(n=>[n]);while(d.cols.length<3)d.cols.push([]);}
    else if(!hasNaga&&!hasForm&&m.k===1&&nums.length>1){d.method='ボックス';d.box=uniq(nums);}
    else{d.method='手入力';d.manualLabel=((hasNaga||hasForm)?b2.replace(/\s+/g,' ').trim().slice(0,30):'')||(nums.length?nums.join('-'):'要確認');d.manualPoints=1;}
    const n=enumTicket(d).n;
    if(d.method==='手入力'){d.unit=amount||100;d.manualPoints=1;}
    else if(amount&&n&&amount%(n*100)===0)d.unit=amount/n;
    else if(amount){d.method='手入力';d.manualLabel=nums.join('-')||'要確認';d.manualPoints=1;d.unit=amount;}
    tickets.push(finalizeTicket(d));
  });
  const pm=t.match(/払戻[^\d]{0,8}((?:\d{1,3}(?:,\d{3})+|\d+))\s*円/);
  if(pm&&tickets.length===1){tickets[0].result='hit';tickets[0].payout=+pm[1].replace(/,/g,'');}
  return {meta,tickets};
}

/* ===== 重賞日程の貼り付け解析 ===== */
function parseSchedule(raw,defYear){
  const text=normT(raw).replace(/https?:\/\/\S+/g,' ').replace(/[　\t ]/g,' ');
  const TR=TRACKS_JRA.filter(t=>t!=='海外');
  const WDC='日月火水木金土';
  const dateRe=/(?:(20\d{2})\s*[\/年.\-]\s*)?(\d{1,2})\s*(?:月\s*(\d{1,2})\s*日?|[\/.]\s*(\d{1,2}))(?:\s*[(（]\s*(祝)?([日月火水木金土])?(?:曜日?)?(祝)?\s*[)）])?/;
  const GSRC='(?<![A-Za-z])(J[・.]?)?G\\s?(III|II|I|[123])(?![A-Za-z])';
  const gradeRe=new RegExp(GSRC),gradeReG=new RegExp(GSRC,'g');
  const DSRC='(芝|ダート|ダ|障害|障)\\s*[・]?\\s*(\\d{1,2},\\d{3}|\\d{3,4})\\s*(?:m|メートル)?';
  const distRe=new RegExp(DSRC),distReG=new RegExp(DSRC,'g');
  const dropWord=/^(?:国際|指定|特指|混合|牝|牡|牝馬|馬齢|定量|別定|ハンデ|ハンデ戦|ハンデキャップ|定|別|オープン|[2-4]歳(?:以上)?(?:オープン|牝馬?)?|賞金\S*|本賞金\S*)$/;
  const isTrackWord=t=>TR.includes(String(t).trim().replace(/競馬場$/,''));
  const dropGroup=inner=>new RegExp(GSRC).test(inner)||/[芝ダ障]\s*[\d,]{3,}/.test(inner)||isTrackWord(inner)||dropWord.test(inner.trim());
  let cur=null,lastY=null;const seen=new Set(),items=[];
  for(const line0 of text.split(/\r?\n/)){
    if(/^\s*[※＊*]/.test(line0))continue;
    let line=line0;
    const dm=dateRe.exec(line);
    if(dm){
      const y=dm[1]?+dm[1]:(lastY||+defYear);
      const mo=+dm[2],d=+(dm[3]||dm[4]);
      const dt=new Date(y,mo-1,d);
      if(mo>=1&&mo<=12&&dt.getMonth()===mo-1&&dt.getDate()===d){
        cur={y,mo,d,wd:dm[6]||null};
        if(dm[1])lastY=y;
        line=line.slice(0,dm.index)+' '+line.slice(dm.index+dm[0].length);
      }
    }
    const gm=gradeRe.exec(line);
    if(!gm||!cur)continue;
    const grade=(gm[1]?'J・':'')+'G'+({I:'1',II:'2',III:'3'}[gm[2]]||gm[2]);
    const dm2=distRe.exec(line);
    let dist='';
    if(dm2)dist=(dm2[1][0]==='ダ'?'ダ':dm2[1][0]==='障'?'障':'芝')+dm2[2].replace(',','')+'m';
    const toks=line.split(/[\s,、，|\/（）()\[\]「」]+/).filter(Boolean);
    let track='';for(const tk of toks)if(isTrackWord(tk))track=tk.replace(/競馬場$/,'');
    let s=line.replace(/[(（]([^()（）]*)[)）]/g,(m,inner)=>dropGroup(inner)?' ':m);
    s=s.replace(gradeReG,' ').replace(distReG,' ').replace(/[、,，|]/g,' ');
    const name=s.split(/\s+/).map(t=>t.replace(/^[☆★■●◆▲▼◇◎○・\-–—]+/,'').replace(/^第\d+回/,'').replace(/[☆★■●◆▲▼]+$/,''))
      .filter(t=>t&&!isTrackWord(t)&&!/^\d+R$/.test(t)&&!/^[\d,]+$/.test(t)&&!dropWord.test(t)&&!/^(?:芝|ダート|ダ|障害|障|内|外|右|左|回り)+$/.test(t))
      .join('').replace(/ステークス/g,'S').replace(/カップ/g,'C');
    if(name.length<2)continue;
    const date=`${cur.y}-${pad(cur.mo)}-${pad(cur.d)}`;
    const key=date+'|'+normName(name);
    if(seen.has(key))continue;seen.add(key);
    const flags=[];
    if(!track)flags.push('track');
    if(cur.wd&&cur.wd!==WDC[new Date(cur.y,cur.mo-1,cur.d).getDay()])flags.push('wd');
    if(name.length>20)flags.push('long');
    items.push({date,name,grade,track,dist,flags});
  }
  return items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}

/* ================= 実績 ================= */
function statRecs(){
  const s=UI.stat;let recs=S.records;
  if(s.mode==='month')recs=recs.filter(r=>r.date.startsWith(`${s.y}-${pad(s.m)}`));
  else if(s.mode==='year')recs=recs.filter(r=>r.date.startsWith(`${s.y}-`));
  return recs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
}
function lineChart(vals,labels,w,h){
  if(!vals.length)return '<div class="empty">データがありません</div>';
  const pd={l:6,r:6,t:14,b:20},iw=w-pd.l-pd.r,ih=h-pd.t-pd.b;
  const min=Math.min(0,...vals),max=Math.max(0,...vals),rng=(max-min)||1;
  const X=i=>pd.l+(vals.length===1?iw/2:i*iw/(vals.length-1)),Y=v=>pd.t+(max-v)/rng*ih;
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  const last=vals[vals.length-1],col=last>=0?'var(--plus)':'var(--minus)';
  const area=`M${X(0).toFixed(1)},${Y(0).toFixed(1)} L${pts.join(' L')} L${X(vals.length-1).toFixed(1)},${Y(0).toFixed(1)} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><path d="${area}" fill="${col}" opacity=".12"/>
    <line x1="${pd.l}" x2="${w-pd.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--sub)" stroke-dasharray="3 3" stroke-width="1"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(vals.length-1)}" cy="${Y(last)}" r="3.5" fill="${col}"/>
    <text x="${pd.l}" y="${h-5}" font-size="10" fill="var(--sub)">${esc(labels[0])}</text>
    <text x="${w-pd.r}" y="${h-5}" font-size="10" fill="var(--sub)" text-anchor="end">${esc(labels[labels.length-1])}</text>
    <text x="${w-pd.r}" y="10" font-size="11" font-weight="700" fill="${col}" text-anchor="end">${fmtPL(last)}</text></svg>`;
}
function monthBars(vals,w,h){
  const pd={l:6,r:6,t:14,b:16},iw=w-pd.l-pd.r,ih=h-pd.t-pd.b;
  const min=Math.min(0,...vals),max=Math.max(0,...vals),rng=(max-min)||1;
  const Y=v=>pd.t+(max-v)/rng*ih,bw=iw/12;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><line x1="${pd.l}" x2="${w-pd.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--sub)" stroke-width="1"/>`;
  vals.forEach((v,i)=>{const x=pd.l+i*bw+bw*.18,ww=bw*.64,y0=Y(0),y1=Y(v);
    s+=`<rect x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${ww.toFixed(1)}" height="${Math.max(Math.abs(y1-y0),v?1.5:0).toFixed(1)}" rx="2" fill="${v>=0?'var(--plus)':'var(--minus)'}"/>
    <text x="${(x+ww/2).toFixed(1)}" y="${h-3}" font-size="9" fill="var(--sub)" text-anchor="middle">${i+1}</text>`;});
  return s+'</svg>';
}
function barRows(items){
  if(!items.length)return '<div class="empty">データがありません</div>';
  return `<div class="bars">${items.map(it=>{const w=Math.min(100,(it.roi||0)/2);return `<div class="br"><span>${esc(it.key)}</span><div class="tr"><i class="${(it.roi||0)<100?'lo':''}" style="width:${w}%"></i><u></u></div><b style="text-align:right">${it.roi==null?'—':it.roi.toFixed(0)+'%'}</b>
    <div class="sm">購入 ${fmtYen(it.cost)} ／ 払戻 ${fmtYen(it.pay)}${it.n!=null?' ／ '+it.n+'点':''}</div></div>`;}).join('')}</div>`;
}
function vStats(){
  const s=UI.stat,recs=statRecs(),a=aggregate(recs);
  const ttl=s.mode==='month'?`${s.y}年${s.m}月`:s.mode==='year'?`${s.y}年`:'通算';
  const nav=s.mode==='all'?'':`<div class="nav"><button data-act="statPrev">‹</button><b>${ttl}</b><button data-act="statNext">›</button></div>`;
  // 収支推移
  const byDay={};recs.forEach(r=>{const p=recAgg(r).profit;byDay[r.date]=(byDay[r.date]||0)+p;});
  const days=Object.keys(byDay).sort();let cum=0;const vals=days.map(d=>(cum+=byDay[d]));
  const line=lineChart(vals,days.map(d=>d.slice(5).replace('-','/')),340,150);
  // 券種別
  const typeItems=TYPE_ORDER.filter(t=>a.byType[t]).map(t=>({key:t,...a.byType[t],roi:a.byType[t].cost?a.byType[t].pay/a.byType[t].cost*100:null}));
  // 競馬場別
  const trackItems=groupAgg(recs,r=>r.track||'不明').filter(x=>x.cost).sort((p,q)=>q.cost-p.cost).map(x=>({key:x.key,cost:x.cost,pay:x.pay,roi:x.roi,n:null}));
  // 年表示: 月別
  let monthly='';
  if(s.mode==='year'){const mv=[];for(let i=1;i<=12;i++)mv.push(aggregate(recs.filter(r=>r.date.startsWith(`${s.y}-${pad(i)}`))).profit);monthly=`<div class="card"><h3>月別収支</h3>${monthBars(mv,340,130)}</div>`;}
  return `<div class="top"><div><h1>実績</h1><div class="sub">収支と回収率</div></div></div>
  <div class="seg">${[['month','月'],['year','年'],['all','通算']].map(([k,l])=>`<button data-act="statMode" data-v="${k}" class="${s.mode===k?'on':''}">${l}</button>`).join('')}</div>
  ${nav}
  <div class="card"><div class="wl" style="font-size:12px;color:var(--sub)">収支</div><div class="kpi pl ${plCls(a.profit)}">${fmtPL(a.profit)}</div>
    <div class="stat6"><div><span>回収率</span><b>${roiTxt(a)}</b></div><div><span>的中率</span><b>${hitTxt(a)}</b></div><div><span>レース数</span><b>${a.races}</b></div>
      <div><span>購入額</span><b>${fmtYen(a.cost)}</b></div><div><span>払戻額</span><b>${fmtYen(a.pay)}</b></div><div><span>結果待ち</span><b>${a.pending}点</b></div></div></div>
  <div class="card"><h3>収支の推移</h3>${line}</div>
  ${monthly}
  <div class="card"><h3>券種別の回収率</h3>${barRows(typeItems)}<div class="note">点線が回収率100%。バーが線を越えていればプラスです。</div></div>
  <div class="card"><h3>競馬場別の回収率</h3>${barRows(trackItems)}</div>`;
}

/* ================= 重賞日程の取り込み ================= */
const SI={text:'',year:'',items:null,sel:{},msg:''};
function siYear(){
  if(+SI.year)return +SI.year;
  const rs=allRaces();const last=rs[rs.length-1].date;const y=+last.slice(0,4);
  return (+last.slice(5,7)===12&&+last.slice(8,10)>=20)?y+1:y;  // 年末までそろっていれば翌年、途中までなら同じ年
}
function siParse(){
  SI.items=parseSchedule(SI.text,siYear());
  SI.sel={};SI.items.forEach((it,i)=>{SI.sel[i]=!it.flags.length;});
  SI.msg=SI.items.length?'':'重賞(G1〜G3)の行を見つけられませんでした。日付・レース名・グレード(GI/GII/GIII)が1行にそろった部分を貼り付けてください。';
  render();
}
function siApply(){
  if(!SI.items)return;
  let add=0,upd=0,skip=0;
  SI.items.forEach((it,i)=>{
    if(!SI.sel[i])return;
    const nn=normName(it.name);
    if(RACES.some(r=>r.date===it.date&&normName(r.name)===nn)){skip++;return;}
    const ex=S.customRaces.find(r=>r.date===it.date&&normName(r.name)===nn);
    const rec={date:it.date,grade:it.grade,name:it.name,track:it.track,dist:it.dist,kind:'JRA',custom:true};

async function fileToCanvas(file,max){
  let bmp;
  try{bmp=await createImageBitmap(file);}catch(e){
    bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});
  }
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c;
}

function tkPick(g,n){
  const m=TT[T.type];
  if(g.startsWith('cols:')){
    const i=+g.slice(5);const cur=T.cols[i]||[];
    if(T.method==='通常'){T.cols[i]=cur[0]===n?[]:[n];}
    else T.cols[i]=cur.includes(n)?cur.filter(v=>v!==n):cur.concat(n);
  }else if(g==='box'){T.box=T.box.includes(n)?T.box.filter(v=>v!==n):T.box.concat(n);}
  else if(g==='axis'){
    if(T.axis.includes(n))T.axis=T.axis.filter(v=>v!==n);
    else{T.axis=T.axis.concat(n);if(T.axis.length>T.axisN)T.axis=T.axis.slice(-T.axisN);}
    T.partners=T.partners.filter(v=>!T.axis.includes(v));
  }else if(g==='partners'){
    if(T.axis.includes(n))return;
    T.partners=T.partners.includes(n)?T.partners.filter(v=>v!==n):T.partners.concat(n);
  }
}
function saveTicket(){
  const m=TT[T.type];const {n}=enumTicket(T);
  if(n<1){toast('馬番を選んで、点数が1以上になるようにしてください');return;}

  if(T.result==='hit'&&!(+T.payout>0)){toast('的中の払戻金を入力してください');return;}
  const tk=finalizeTicket(Object.assign({},T,{id:T.id||uid()}));

/* ================= 読み取り(OCR) ================= */
let tessPromise=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(tessPromise)return tessPromise;
  tessPromise=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>{tessPromise=null;rej(new Error('load'));};document.head.appendChild(s);});
  return tessPromise;
}
async function runOCR(file,onProg){
  await loadTess();
  const cv=await fileToCanvas(file,1800);
  const w=await Tesseract.createWorker('jpn+eng',1,{logger:m=>{if(m.status==='recognizing text')onProg(m.progress);}});
  try{const {data}=await w.recognize(cv);return data.text||'';}finally{try{await w.terminate();}catch(e){}}
}

      const hs=SC.parsed.horses;
      prev=`<div class="card"><h3>読み取り結果</h3>
        ${hs.length?`<div class="sl" style="margin-top:0">出走馬 ${hs.length}頭</div><div class="chips">${hs.map(h=>`<span class="chip nm" style="min-width:0"><b>${h.no}</b><i>${esc(h.name)}</i></span>`).join('')}</div>`:'<div class="note">出走馬を認識できませんでした。下の文字を直すか、貼り付けテキストをお試しください。</div>'}
        ${metaLine(SC.parsed.meta)}</div>`;
    }else{
      const ts=SC.parsed.tickets;
      prev=`<div class="card"><h3>読み取り結果</h3>
        ${ts.length?ts.map(t=>`<div class="tk"><div class="l"><b>${esc(t.label)}</b><span>${t.points}点 × ${fmtYen(t.unit)} = ${fmtYen(t.cost)}${t.result==='hit'?' / 払戻 '+fmtYen(t.payout):''}</span></div></div>`).join(''):'<div class="note">馬券を認識できませんでした。券種名(馬連・三連複など)を含む文字が必要です。</div>'}
        ${metaLine(SC.parsed.meta)}
        <div class="note">反映後に、馬券を1件ずつ開いて内容を確認・修正してください。</div></div>`;
    }
  }
  L.innerHTML=`<div class="sheet-head"><button data-act="closeL2">閉じる</button><b>${card?'出馬表を読み取る':'馬券を読み取る'}</b>
    <button class="primary" data-act="scanApply" ${SC.parsed&&(card?SC.parsed.horses.length||Object.keys(SC.parsed.meta).length:SC.parsed.tickets.length)?'':'disabled style="opacity:.4"'}>反映</button></div>
  <div class="sheet-body">
   <div class="card">
    <button class="btn fill" data-act="scanPhoto" ${SC.busy?'disabled':''}>写真を選ぶ / 撮影する</button>
    ${SC.busy?`<div class="prog"><i style="width:${Math.round(SC.prog*100)}%"></i></div><div class="note">${esc(SC.msg)}</div>`:(SC.msg?`<div class="note">${esc(SC.msg)}</div>`:'')}
    <div class="note">${card?'JRAの出馬表の画面、または紙の出馬表を撮影してください。':'紙の馬券、またはネット投票の購入履歴・投票内容の画面(スクリーンショット)に対応しています。'}
    文字の読み取りは端末内のブラウザで行います(初回のみ言語データをダウンロード)。</div>
   </div>
   <div class="card"><h3>読み取った文字 / 貼り付け</h3>
    <textarea id="scText" style="min-height:120px" placeholder="${card?'JRAのサイトの出馬表をコピーして、ここに貼り付けても取り込めます':'ここに文字を貼り付けても取り込めます'}">${esc(SC.text)}</textarea>
    <button class="btn" data-act="scanParse" style="margin-top:8px">この文字を解析する</button>
    <div class="note">OCRの誤読は、ここで直してから「解析する」を押すと反映されます。</div></div>
   ${prev}
  </div>`;
  const nb=$('.sheet-body',L);if(nb)nb.scrollTop=st;
}
function metaLine(m){
  const bits=[];if(m.name)bits.push(esc(m.name));if(m.date)bits.push(m.date.replace(/-/g,'/'));if(m.track)bits.push(esc(m.track));if(m.raceNo)bits.push(m.raceNo+'R');if(m.dist)bits.push(esc(m.dist));if(m.grade)bits.push(esc(m.grade));
  return bits.length?`<div class="sl">レース情報: ${bits.join(' / ')}</div>`:'';
}
function scanParseNow(){
  const text=($('#scText')||{}).value||SC.text;SC.text=text;
  SC.parsed=SC.mode==='card'?parseRaceCard(text):parseTickets(text);
  renderScan();
}
async function scanPhoto(){
  pickFile('image/*',async f=>{
    SC.busy=true;SC.prog=0;SC.msg='文字を読み取っています…(数十秒かかることがあります)';renderScan();
    try{
      const text=await runOCR(f,p=>{SC.prog=p;const b=$('.prog i');if(b)b.style.width=Math.round(p*100)+'%';});
      SC.text=text;SC.busy=false;SC.msg=text.trim()?'読み取り完了。内容を確認してください。':'文字を認識できませんでした。明るい場所で、文字が大きく写るように撮り直してください。';
      SC.parsed=SC.mode==='card'?parseRaceCard(text):parseTickets(text);
    }catch(e){SC.busy=false;SC.msg='読み取りに失敗しました。ネット接続を確認するか、文字を貼り付けて解析してください。';}
    renderScan();
  });
}
function scanApply(){
  const p=SC.parsed;if(!p)return;
  const m=p.meta||{};
  if(SC.mode==='card'){
    F.horses=p.horses;
    if(m.date)F.date=m.date;if(m.track)F.track=m.track;if(m.name)F.name=m.name;if(m.grade)F.grade=m.grade;if(m.dist)F.dist=m.dist;if(m.raceNo)F.raceNo=m.raceNo;
  }else{
    for(const t of p.tickets){t.id=uid();F.tickets.push(t);}
    if(m.date&&F._isNew&&!F.name)F.date=m.date;
    if(m.track&&!F.name)F.track=m.track;
    if(m.raceNo&&!F.raceNo)F.raceNo=m.raceNo;
    if(m.name&&!F.name){F.name=m.name;F.grade=m.grade||F.grade;F.dist=m.dist||F.dist;}
  }
  hideLayer('layer2');renderForm();toast('反映しました');
}

/* ================= 保存・削除 ================= */
function saveForm(){
  if(!F.date){toast('日付を入力してください');return;}
  if(!F.track){toast('競馬場を選んでください');return;}
  const rec=JSON.parse(JSON.stringify(F));delete rec._isNew;
  rec.raceNo=rec.raceNo?parseInt(rec.raceNo,10)||'':'';
  if(!rec.id){rec.id=uid();rec.created=Date.now();S.records.push(rec);}
  else{const i=S.records.findIndex(r=>r.id===rec.id);if(i>=0)S.records[i]=rec;else S.records.push(rec);}
  save();hideLayer('layer');F=null;
  UI.calSel=rec.date;const d=parseYmd(rec.date);UI.calY=d.getFullYear();UI.calM=d.getMonth()+1;
  render();toast('保存しました');
}
async function deleteRecord(){
  if(!confirm('この記録を削除しますか?'))return;
  const rec=S.records.find(r=>r.id===F.id);
  if(rec)for(const id of rec.photoIds||[]){try{await IDB.del(id);}catch(e){}}
  S.records=S.records.filter(r=>r.id!==F.id);save();hideLayer('layer');F=null;render();toast('削除しました');
}

/* ================= バックアップ ================= */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
async function exportJson(withPhotos){
  const out={app:'keibaTecho',version:1,exportedAt:new Date().toISOString(),data:S};
  if(withPhotos){
    out.photos={};
    for(const r of S.records)for(const id of r.photoIds||[]){try{const b=await IDB.get(id);if(b)out.photos[id]=await blobToDataURL(b);}catch(e){}}
  }
  download(`keiba-techo-${todayStr()}.json`,new Blob([JSON.stringify(out)],{type:'application/json'}));
  toast('書き出しました');
}
function importJson(){
  pickFile('.json,application/json',async f=>{
    try{
      const j=JSON.parse(await f.text());const d=j.data||j;
      if(!Array.isArray(d.records))throw new Error('bad');
      if(!confirm(`${d.records.length}件の記録を読み込みます。同じ記録は上書きされます。よろしいですか?`))return;
      const map=new Map(S.records.map(r=>[r.id,r]));d.records.forEach(r=>map.set(r.id,r));S.records=[...map.values()];
      const cr=new Map((S.customRaces||[]).map(r=>[r.date+r.name,r]));(d.customRaces||[]).forEach(r=>cr.set(r.date+r.name,r));S.customRaces=[...cr.values()];
      if(d.settings)S.settings=Object.assign({},S.settings,d.settings);
      if(j.photos)for(const [id,url] of Object.entries(j.photos)){try{const b=await (await fetch(url)).blob();await IDB.put(id,b);}catch(e){}}
      save();render();toast('読み込みました');
    }catch(e){toast('読み込めませんでした(ファイルを確認してください)');}
  });
}
function exportCsv(){
  const rows=[['日付','競馬場','R','レース名','グレード','券種','買い方','買い目','点数','1点金額','購入額','結果','払戻金','収支']];
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rs=S.records.slice().sort((a,b)=>a.date<b.date?-1:1);
  for(const r of rs)for(const t of r.tickets||[]){
    const res={pending:'結果待ち',hit:'的中',miss:'ハズレ',refund:'返還'}[t.result];
    rows.push([r.date,r.track,r.raceNo,r.name,r.grade,t.type,t.method,t.label,t.points,t.unit,t.cost,res,t.payout,settled(t)?(t.payout||0)-(t.cost||0):'']);
  }
  download(`keiba-techo-${todayStr()}.csv`,new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));
}

/* ================= イベント ================= */
function openNew(preset){openForm(null,preset);}
function actions(act,d,el){
  switch(act){
    case 'tab':UI.tab=d.v;render();window.scrollTo(0,0);break;
    case 'new':openNew();break;
    case 'newOn':openNew({date:d.d});break;
    case 'newRace':{const r=allRaces().find(x=>x.date===d.d&&x.name===d.n);openNew(r?{date:r.date,track:r.track,name:r.name,grade:r.grade,dist:r.dist}:{date:d.d});break;}
    case 'edit':{const r=S.records.find(x=>x.id===d.id);if(r)openForm(r);break;}
    case 'calPrev':UI.calM--;if(UI.calM<1){UI.calM=12;UI.calY--;}render();break;
    case 'calNext':UI.calM++;if(UI.calM>12){UI.calM=1;UI.calY++;}render();break;
    case 'calSel':UI.calSel=d.d;render();break;
    case 'statMode':UI.stat.mode=d.v;render();break;
    case 'statPrev':if(UI.stat.mode==='month'){UI.stat.m--;if(UI.stat.m<1){UI.stat.m=12;UI.stat.y--;}}else UI.stat.y--;render();break;
    case 'statNext':if(UI.stat.mode==='month'){UI.stat.m++;if(UI.stat.m>12){UI.stat.m=1;UI.stat.y++;}}else UI.stat.y++;render();break;
    // form
    case 'closeForm':if(confirm('入力中の内容は保存されません。閉じますか?')){hideLayer('layer');F=null;}break;
    case 'saveForm':saveForm();break;
    case 'delRecord':deleteRecord();break;
    case 'pickRace':openPicker();break;
    case 'pickDo':{const r=allRaces().find(x=>x.date===d.d&&x.name===d.n);if(r){applyRace(r);hideLayer('layer2');renderForm();}break;}
    case 'pkg':PK.g=d.v;renderPicker(false);break;
    case 'closeL2':hideLayer('layer2');if(F)renderForm();break;
    case 'addTicket':openTicket(null);break;
    case 'editTicket':openTicket(+d.i);break;
    case 'delTicket':F.tickets.splice(+d.i,1);renderForm();break;
    case 'addPhoto':pickFile('image/*',async f=>{try{const c=await fileToCanvas(f,1280);const b=await toBlob(c,.72);const id='p'+uid();await IDB.put(id,b);F.photoIds.push(id);renderForm();}catch(e){toast('写真を保存できませんでした');}});break;
    case 'delPhoto':{F.photoIds=F.photoIds.filter(x=>x!==d.id);IDB.del(d.id).catch(()=>{});renderForm();break;}
    // ticket
    case 'closeTicket':hideLayer('layer2');T=null;break;
    case 'saveTicket':saveTicket();break;
    case 'tkType':{const first=T.method;T.type=d.v;resetSel();if(!methodsFor(T.type).includes(T.method))T.method=methodsFor(T.type)[0];renderTicket();break;}
    case 'tkMethod':T.method=d.v;resetSel();renderTicket();break;
    case 'tkPick':tkPick(d.g,+d.n);renderTicket();break;
    case 'axisN':T.axisN=+d.v;T.axis=T.axis.slice(-T.axisN);T.axisPos='multi';renderTicket();break;
    case 'axisPos':T.axisPos=d.v;renderTicket();break;
    case 'unitUp':T.unit=(+T.unit||100)+100;renderTicket();break;
    case 'unitDn':T.unit=Math.max(100,(+T.unit||100)-100);renderTicket();break;
    case 'tkResult':T.result=d.v;if(T.result==='miss')T.payout=0;renderTicket();break;
    // scan
    case 'scanCard':openScan('card');break;
    case 'scanTicket':openScan('ticket');break;
    case 'scanPhoto':scanPhoto();break;
    case 'scanParse':scanParseNow();break;
    case 'scanApply':scanApply();break;
    // settings
    case 'exportJson':exportJson(false);break;
    case 'exportJsonPhoto':exportJson(true);break;
    case 'importJson':importJson();break;
    case 'exportCsv':exportCsv();break;
    case 'addCustom':{
      const date=$('#crDate').value,name=$('#crName').value.trim();
      if(!date||!name){toast('日付とレース名を入力してください');break;}
      const track=$('#crTrack').value;
      S.customRaces.push({date,grade:$('#crGrade').value,name,track,dist:$('#crDist').value.trim(),kind:'JRA',custom:true});
      save();render();toast('追加しました');break;}
    case 'delCustom':S.customRaces.splice(+d.i,1);save();render();break;
    case 'delCustomAll':if(confirm('取り込み・追加した重賞をすべて削除します(記録は消えません)。よろしいですか?')){S.customRaces=[];save();render();}break;
    case 'siParse':siParse();break;
    case 'siApply':siApply();break;
    case 'siFile':siFile();break;
    case 'siToggle':SI.sel[+d.i]=!SI.sel[+d.i];render();break;
    case 'wipe':if(confirm('すべての記録を削除します。元に戻せません。よろしいですか?')&&confirm('本当に削除しますか?(先にバックアップをおすすめします)')){S.records=[];save();render();toast('削除しました');}break;
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.disabled)return;
  actions(el.dataset.act,el.dataset,el);
});
function onField(e){
  const t=e.target;
  if(t.dataset.f&&F){F[t.dataset.f]=t.value;if(t.dataset.f==='track'){}return;}
  if(t.dataset.tf&&T){
    const k=t.dataset.tf;
    if(k==='unit'){T.unit=+t.value||100;if(e.type==='change')renderTicket();else refreshCost();}
    else if(k==='manualPoints'){T.manualPoints=+t.value||0;refreshCost();}
    else if(k==='odds'){T.odds=t.value;const {n}=enumTicket(T);const unit=Math.max(100,+T.unit||100);const pay=Math.floor((+t.value||0)*unit/10)*10;T.payout=pay;const p=$('#tkPay');if(p)p.value=pay||'';}
    else T[k]=t.value;
    return;
  }
  const ai=t.dataset.actInput;
  if(ai==='listQ'){UI.listQ=t.value;const pos=t.selectionStart;render();const el=$('[data-act-input="listQ"]');if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}}
  else if(ai==='siText'){SI.text=t.value;}
  else if(ai==='siYear'){SI.year=t.value;}
  else if(ai==='pkq'){PK.q=t.value;const pos=t.selectionStart;renderPicker(false);const el=$('#pkq');if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}}
}
function refreshCost(){const {n}=enumTicket(T);const unit=Math.max(100,+T.unit||100);const c=$('#tkCost');if(c)c.textContent='購入額 '+fmtYen(n*unit);}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

/* ================= 起動 ================= */
load();
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
